<div class="container-fluid">
  <div class="row">
    <div class="col-12 no-padding background-image-contact" style="background-image: url(../img/Imagen_carrusel.jpeg);">
      <div class="imagen-inicial-container">
        <div class="form-contact-container">
          <h1 class="weight-700 text-center">CONTACTANOS</h1>
          <form action="#">
            <div class="form-group">
              <label for="name">Nombre:</label>
              <input type="text" class="form-control" id="name" placeholder="Nombre">
            </div>
            <div class="form-group">
              <label for="email">Correo:</label>
              <input type="email" class="form-control" id="email" placeholder="Correo">
            </div>
            <div class="form-group">
              <label for="phone">Teléfono:</label>
              <input type="tel" class="form-control" id="phone" placeholder="Teléfono">
            </div>
            <div class="form-group">
              <label for="message">Mensaje:</label>
              <textarea class="form-control" id="message" rows="3" placeholder="Mensaje"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Enviar</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
